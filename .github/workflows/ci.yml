name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m ruff check src tests
      - run: python -m pytest
      - name: Check release shape
        run: |
          test "$(git ls-files '*.md' | wc -l)" -eq 1
          test -f README.md
          test -f results/results.json
      - name: Run the local quickstart
        run: |
          budget-router semantic-train \
            --outcomes examples/outcomes.example.jsonl \
            --model-cards examples/model_cards.example.json \
            --output /tmp/router.json
          budget-router semantic-evaluate \
            --artifact /tmp/router.json \
            --outcomes examples/heldout.example.jsonl \
            --output /tmp/evaluation.json
          budget-router agent-route \
            --artifact /tmp/router.json \
            --messages examples/agent_messages.example.json

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build pip
      - run: python -m build
      - name: Test the wheel
        run: |
          python -m venv /tmp/router-wheel
          /tmp/router-wheel/bin/pip install dist/*.whl
          /tmp/router-wheel/bin/python -c "from budget_router import SemanticRouter, SemanticAgentRouter"
          /tmp/router-wheel/bin/budget-router --help
