<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
  <title id="title">Prompt routing quality-cost curves</title>
  <desc id="desc">Four learned routing methods trace quality-cost curves on 2,184 held-out prompts. The published balanced shared classifier is highlighted, along with the failed confirmatory primary, GPT-5, and a non-deployable hindsight oracle.</desc>
