<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="550" viewBox="0 0 1120 550" role="img" aria-labelledby="title desc">
  <title id="title">Budget Router architecture</title>
  <desc id="desc">Offline training produces a calibrated artifact. Online routing applies hard constraints, predicts success per model, and selects a model. Provider execution remains separate.</desc>
  <rect width="1120" height="550" fill="#ffffff"/>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .label { font-size: 18px; font-weight: 600; }
    .small { font-size: 15px; fill: #5f6b7a; }
    .tick { font-size: 14px; fill: #5f6b7a; }
    .number { font-size: 24px; font-weight: 700; }
  </style>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5f6b7a"/>
    </marker>
  </defs>
  <text x="40" y="45" class="label">Offline: learn one immutable routing artifact</text>
  <rect x="40" y="70" width="220" height="112" rx="14" fill="#f6f8fb" stroke="#d9dee8"/>
  <text x="62" y="104" class="label">Outcome matrix</text>
  <text x="62" y="132" class="small">Requests × candidate models</text>
  <text x="62" y="154" class="small">Train and calibration splits</text>
<path d="M 260 126 H 302" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <rect x="302" y="70" width="220" height="112" rx="14" fill="#f6f8fb" stroke="#d9dee8"/>
  <text x="324" y="104" class="label">Classifier</text>
  <text x="324" y="132" class="small">P(success | request, model)</text>
  <text x="324" y="154" class="small">Shared features + interactions</text>
<path d="M 522 126 H 564" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <rect x="564" y="70" width="220" height="112" rx="14" fill="#f6f8fb" stroke="#d9dee8"/>
  <text x="586" y="104" class="label">Calibration</text>
  <text x="586" y="132" class="small">Per-model probabilities</text>
  <text x="586" y="154" class="small">Non-inferiority gate</text>
<path d="M 784 126 H 826" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <rect x="826" y="70" width="254" height="112" rx="14" fill="#f6f8fb" stroke="#d9dee8"/>
  <text x="848" y="104" class="label">Versioned artifact</text>
  <text x="848" y="132" class="small">Weights, calibrators, costs</text>
  <text x="848" y="154" class="small">Cards, policy, content hash</text>

  <line x1="40" y1="225" x2="1080" y2="225" stroke="#d9dee8"/>
  <text x="40" y="270" class="label">Online: select before inference</text>
  <rect x="40" y="295" width="190" height="122" rx="14" fill="#f6f8fb" stroke="#d9dee8"/>
  <text x="62" y="329" class="label">Visible state</text>
  <text x="62" y="357" class="small">Prompt or agent prefix</text>
  <text x="62" y="379" class="small">Token estimate</text>
<path d="M 230 356 H 270" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <rect x="270" y="295" width="190" height="122" rx="14" fill="#f6f8fb" stroke="#d9dee8"/>
  <text x="292" y="329" class="label">Hard filters</text>
  <text x="292" y="357" class="small">Capability and context</text>
  <text x="292" y="379" class="small">Provider and cost limits</text>
<path d="M 460 356 H 500" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <rect x="500" y="295" width="200" height="122" rx="14" fill="#f6f8fb" stroke="#d9dee8"/>
  <text x="522" y="329" class="label">Success surface</text>
  <text x="522" y="357" class="small">Calibrated probability</text>
  <text x="522" y="379" class="small">for each eligible model</text>
<path d="M 700 356 H 740" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <rect x="740" y="295" width="160" height="122" rx="14" fill="#f6f8fb" stroke="#d9dee8"/>
  <text x="762" y="329" class="label">Policy</text>
  <text x="762" y="357" class="small">Quality, balanced,</text>
  <text x="762" y="379" class="small">or cost mode</text>
<path d="M 900 356 H 940" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <rect x="940" y="295" width="140" height="122" rx="14" fill="#f6f8fb" stroke="#d9dee8"/>
  <text x="962" y="329" class="label">Selection</text>
  <text x="962" y="357" class="small">Model ID</text>
  <text x="962" y="379" class="small">No API call</text>

  <path d="M1010 417 V474 H760" stroke="#5f6b7a" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <rect x="430" y="448" width="330" height="68" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="452" y="478" class="label">Provider/runtime layer</text>
  <text x="452" y="501" class="small">Endpoint, health, latency, retry, session cache</text>

</svg>
