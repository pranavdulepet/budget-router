<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="625" viewBox="0 0 1120 625" role="img" aria-labelledby="title desc">
  <title id="title">Agent routing quality and cost</title>
  <desc id="desc">On 60 held-out SWE-bench tasks, fixed GPT-OSS resolved 13 at 9.53 dollars, fixed Qwen resolved 24 at 30.98 dollars, and the guarded router resolved 26 at 24.54 dollars.</desc>
  <rect width="1120" height="625" fill="#ffffff"/>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .label { font-size: 18px; font-weight: 600; }
    .small { font-size: 15px; fill: #5f6b7a; }
    .tick { font-size: 14px; fill: #5f6b7a; }
    .number { font-size: 24px; font-weight: 700; }
  </style>
<line x1="105.0" y1="55" x2="105.0" y2="520" stroke="#d9dee8"/>
  <text x="105.0" y="548" text-anchor="middle" class="tick">$0</text>
  <line x1="222.1" y1="55" x2="222.1" y2="520" stroke="#d9dee8"/>
  <text x="222.1" y="548" text-anchor="middle" class="tick">$5</text>
  <line x1="339.3" y1="55" x2="339.3" y2="520" stroke="#d9dee8"/>
  <text x="339.3" y="548" text-anchor="middle" class="tick">$10</text>
  <line x1="456.4" y1="55" x2="456.4" y2="520" stroke="#d9dee8"/>
  <text x="456.4" y="548" text-anchor="middle" class="tick">$15</text>
  <line x1="573.6" y1="55" x2="573.6" y2="520" stroke="#d9dee8"/>
  <text x="573.6" y="548" text-anchor="middle" class="tick">$20</text>
  <line x1="690.7" y1="55" x2="690.7" y2="520" stroke="#d9dee8"/>
  <text x="690.7" y="548" text-anchor="middle" class="tick">$25</text>
  <line x1="807.9" y1="55" x2="807.9" y2="520" stroke="#d9dee8"/>
  <text x="807.9" y="548" text-anchor="middle" class="tick">$30</text>
  <line x1="925.0" y1="55" x2="925.0" y2="520" stroke="#d9dee8"/>
  <text x="925.0" y="548" text-anchor="middle" class="tick">$35</text>
  <line x1="105" y1="520.0" x2="925" y2="520.0" stroke="#d9dee8"/>
  <text x="91" y="525.0" text-anchor="end" class="tick">0</text>
  <line x1="105" y1="442.5" x2="925" y2="442.5" stroke="#d9dee8"/>
  <text x="91" y="447.5" text-anchor="end" class="tick">5</text>
  <line x1="105" y1="365.0" x2="925" y2="365.0" stroke="#d9dee8"/>
  <text x="91" y="370.0" text-anchor="end" class="tick">10</text>
  <line x1="105" y1="287.5" x2="925" y2="287.5" stroke="#d9dee8"/>
  <text x="91" y="292.5" text-anchor="end" class="tick">15</text>
  <line x1="105" y1="210.0" x2="925" y2="210.0" stroke="#d9dee8"/>
  <text x="91" y="215.0" text-anchor="end" class="tick">20</text>
  <line x1="105" y1="132.5" x2="925" y2="132.5" stroke="#d9dee8"/>
  <text x="91" y="137.5" text-anchor="end" class="tick">25</text>
  <line x1="105" y1="55.0" x2="925" y2="55.0" stroke="#d9dee8"/>
  <text x="91" y="60.0" text-anchor="end" class="tick">30</text>
  <circle cx="328.3" cy="318.5" r="11" fill="#e17b21" stroke="#ffffff" stroke-width="3"/>
  <text x="342.3" y="345.5" text-anchor="start" class="label">Fixed GPT-OSS 20B</text>
  <text x="342.3" y="367.5" text-anchor="start" class="small">13/60 · $9.53</text>
  <circle cx="830.8" cy="148.0" r="11" fill="#2563eb" stroke="#ffffff" stroke-width="3"/>
  <text x="814.8" y="176.0" text-anchor="end" class="label">Fixed Qwen3.6 35B</text>
  <text x="814.8" y="198.0" text-anchor="end" class="small">24/60 · $30.98</text>
  <circle cx="679.9" cy="117.0" r="11" fill="#178a55" stroke="#ffffff" stroke-width="3"/>
  <text x="665.9" y="97.0" text-anchor="end" class="label">Guarded router</text>
  <text x="665.9" y="119.0" text-anchor="end" class="small">26/60 · $24.54</text>
  <text x="515.0" y="590" text-anchor="middle" class="label">Conservative cost across 60 tasks</text>
  <text x="25" y="287.5" transform="rotate(-90 25 287.5)" text-anchor="middle" class="label">Officially resolved SWE-bench tasks</text>
  <rect x="955" y="90" width="140" height="248" rx="14" fill="#f6f8fb" stroke="#d9dee8"/>
  <text x="975" y="124" class="label">Router vs Qwen</text>
  <text x="975" y="168" class="number">20.79%</text>
  <text x="975" y="191" class="small">lower cost</text>
  <text x="975" y="235" class="small">Quality difference</text>
  <text x="975" y="257" class="small">95% interval:</text>
  <text x="975" y="281" class="label">−6.67 to +13.33</text>
  <text x="975" y="303" class="small">percentage points</text>
  <text x="955" y="390" class="small">Observed quality:</text>
  <text x="955" y="412" class="small">26 vs 24. The interval</text>
  <text x="955" y="434" class="small">does not establish</text>
  <text x="955" y="456" class="small">quality superiority.</text>
</svg>
