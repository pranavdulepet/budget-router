<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc">
  <title id="title">Guarded agent router decisions</title>
  <desc id="desc">A bar chart partitions 2,866 agent calls by the classifier or guard reason that selected Qwen or GPT-OSS.</desc>
  <rect width="1120" height="610" fill="#ffffff"/>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .label { font-size: 18px; font-weight: 600; }
    .small { font-size: 15px; fill: #5f6b7a; }
    .tick { font-size: 14px; fill: #5f6b7a; }
    .number { font-size: 24px; font-weight: 700; }
  </style>
<text x="40" y="44" class="small">Every visible prefix produced one auditable reason.</text>
  <text x="40" y="100" class="label">Classifier selected Qwen</text>
  <rect x="390" y="82" width="640" height="28" rx="6" fill="#d9dee8"/>
  <rect x="390" y="82" width="640.0" height="28" rx="6" fill="#2563eb"/>
  <text x="1045" y="102" class="label">1,794</text>
  <text x="40" y="168" class="label">Initial-call guard forced Qwen</text>
  <rect x="390" y="150" width="640" height="28" rx="6" fill="#d9dee8"/>
  <rect x="390" y="150" width="42.8" height="28" rx="6" fill="#5f6b7a"/>
  <text x="1045" y="170" class="label">120</text>
  <text x="40" y="236" class="label">Context guard forced Qwen</text>
  <rect x="390" y="218" width="640" height="28" rx="6" fill="#d9dee8"/>
  <rect x="390" y="218" width="138.8" height="28" rx="6" fill="#5f6b7a"/>
  <text x="1045" y="238" class="label">389</text>
  <text x="40" y="304" class="label">Dwell guard forced Qwen</text>
  <rect x="390" y="286" width="640" height="28" rx="6" fill="#d9dee8"/>
  <rect x="390" y="286" width="25.7" height="28" rx="6" fill="#5f6b7a"/>
  <text x="1045" y="306" class="label">72</text>
  <text x="40" y="372" class="label">Cheap-burst guard forced Qwen</text>
  <rect x="390" y="354" width="640" height="28" rx="6" fill="#d9dee8"/>
  <rect x="390" y="354" width="45.3" height="28" rx="6" fill="#5f6b7a"/>
  <text x="1045" y="374" class="label">127</text>
  <text x="40" y="440" class="label">Classifier selected GPT-OSS</text>
  <rect x="390" y="422" width="640" height="28" rx="6" fill="#d9dee8"/>
  <rect x="390" y="422" width="129.9" height="28" rx="6" fill="#178a55"/>
  <text x="1045" y="442" class="label">364</text>
  <line x1="40" y1="505" x2="1080" y2="505" stroke="#d9dee8"/>
  <text x="40" y="548" class="number">2,866 calls</text>
  <text x="240" y="548" class="number">364 cheap calls</text>
  <text x="515" y="548" class="number">56/60 trajectories</text>
  <text x="805" y="548" class="number">400 switches</text>
  <text x="40" y="575" class="small">total</text>
  <text x="240" y="575" class="small">12.70% of all calls</text>
  <text x="515" y="575" class="small">used GPT-OSS at least once</text>
  <text x="805" y="575" class="small">between model tiers</text>
</svg>
